[project]
name = "demo-super-transcript"
version = "0.1.0"
description = "VoxBridge: live transcription, multilingual translation, and voice cloning through Mistral Workflows"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.0.0,<4",
    "pydantic",
    "python-dotenv",
    "mistralai[realtime]>=2.10.1,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "jsonpatch>=1.33",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "semgrep>=1.0",
    "pytest>=8.0",
    "playwright>=1.50",
]

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend", "src/workers"]
